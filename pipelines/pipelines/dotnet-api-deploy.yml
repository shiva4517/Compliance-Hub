# Deploy Pipeline: ComplianceHub .NET 10 Web API
# Triggered automatically when dotnet-api-build.yml completes successfully.
# Deploys directly to the Production App Service (no slots, no swap).
trigger: none

resources:
  pipelines:
    - pipeline: dotnet-api-build
      source: 'ComplianceHub dotnet API Build'    # must match the pipeline name in Azure DevOps
      trigger:
        branches:
          include:
            - master

variables:
  - template: templates/variables.yml

stages:
  - stage: Deploy_Prod
    displayName: Deploy to Production
    jobs:
      - deployment: Deploy
        displayName: Deploy API to production
        pool:
          vmImage: windows-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - download: dotnet-api-build
                  artifact: dotnet-api

                - task: AzureAppServiceSettings@1
                  displayName: Apply App Settings (production)
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    # no slotName → targets the production (default) slot
                    appSettings: |
                      [
                        { "name": "ASPNETCORE_ENVIRONMENT",                  "value": "Production",                                                                                              "slotSetting": false },
                        { "name": "ConnectionStrings__DefaultConnection",    "value": "$(ComplianceHub_DB_CONNECTION_PROD)",                                                                     "slotSetting": false },
                        { "name": "ConnectionStrings__RegulationsConnection","value": "$(ComplianceHub_REGULATIONS_DB_CONN_PROD)",                                                               "slotSetting": false },
                        { "name": "ALLOWED_ORIGIN_CLIENT_URL",               "value": "https://app-compliance-hub-ui-g4gmfpfsaeg9fdca.canadacentral-01.azurewebsites.net",                        "slotSetting": false },
                        { "name": "WEBSITE_RUN_FROM_PACKAGE",                "value": "1",                                                                                                       "slotSetting": false }
                      ]

                - task: AzureWebApp@1
                  displayName: Deploy zip to production
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webApp
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    package: '$(Pipeline.Workspace)/dotnet-api-build/dotnet-api/*.zip'
                    deploymentMethod: zipDeploy
