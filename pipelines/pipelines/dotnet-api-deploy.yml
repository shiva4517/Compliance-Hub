# Deploy Pipeline: ComplianceHub .NET 10 Web API
# Triggered automatically when dotnet-api-build.yml completes successfully.
trigger: none

resources:
  pipelines:
    - pipeline: dotnet-api-build
      source: 'ComplianceHub dotnet API Build'    # must match the pipeline name in Azure DevOps
      trigger:
        branches:
          include:
            - master

variables:
  - template: templates/variables.yml

stages:
  - stage: Deploy_Dev
    displayName: Deploy to Dev Slot
    jobs:
      - deployment: Deploy
        displayName: Deploy API to dev slot
        pool:
          vmImage: windows-latest
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - download: dotnet-api-build
                  artifact: dotnet-api

                - task: AzureAppServiceSettings@1
                  displayName: Apply App Settings (dev)
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    slotName: $(deploySlot)
                    appSettings: |
                      [
                        { "name": "ASPNETCORE_ENVIRONMENT",                  "value": "Development",                                                            "slotSetting": true },
                        { "name": "ConnectionStrings__DefaultConnection",    "value": "$(ComplianceHub_DB_CONNECTION_DEV)",                                               "slotSetting": true },
                        { "name": "ConnectionStrings__RegulationsConnection","value": "$(ComplianceHub_REGULATIONS_DB_CONN_DEV)",                                         "slotSetting": true },
                        { "name": "ALLOWED_ORIGIN_CLIENT_URL",               "value": "https://app-compliance-hub-ui-dev-akgtg2f3djdvdwb5.canadacentral-01.azurewebsites.net",                               "slotSetting": true },
                        { "name": "WEBSITE_RUN_FROM_PACKAGE",                "value": "1",                                                                      "slotSetting": false }
                      ]

                - task: AzureWebApp@1
                  displayName: Deploy to dev slot
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webApp
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    deployToSlotOrASE: true
                    slotName: $(deploySlot)
                    package: '$(Pipeline.Workspace)/dotnet-api-build/dotnet-api/*.zip'
                    deploymentMethod: zipDeploy

  # Deploy_QA and Deploy_Prod require manual approval.
  # Configure approvals in Azure DevOps → Environments → qa / production → Approvals and checks.
  - stage: Deploy_QA
    displayName: Deploy to QA Slot
    dependsOn: Deploy_Dev
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Deploy API to QA slot
        pool:
          vmImage: windows-latest
        environment: qa
        strategy:
          runOnce:
            deploy:
              steps:
                - download: dotnet-api-build
                  artifact: dotnet-api

                - task: AzureAppServiceSettings@1
                  displayName: Apply App Settings (qa)
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    slotName: $(qaSlot)
                    appSettings: |
                      [
                        { "name": "ASPNETCORE_ENVIRONMENT",                  "value": "Staging",                                                                "slotSetting": true },
                        { "name": "ConnectionStrings__DefaultConnection",    "value": "$(ComplianceHub_DB_CONNECTION_QA)",                                                "slotSetting": true },
                        { "name": "ConnectionStrings__RegulationsConnection","value": "$(ComplianceHub_REGULATIONS_DB_CONN_QA)",                                          "slotSetting": true },
                        { "name": "ALLOWED_ORIGIN_CLIENT_URL",               "value": "https://app-compliance-hub-ui-qa-fkgfhfgmardrbhh5.canadacentral-01.azurewebsites.net",                                "slotSetting": true },
                        { "name": "WEBSITE_RUN_FROM_PACKAGE",                "value": "1",                                                                      "slotSetting": false }
                      ]

                - task: AzureWebApp@1
                  displayName: Deploy to QA slot
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appType: webApp
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    deployToSlotOrASE: true
                    slotName: $(qaSlot)
                    package: '$(Pipeline.Workspace)/dotnet-api-build/dotnet-api/*.zip'
                    deploymentMethod: zipDeploy

  - stage: Deploy_Prod
    displayName: Deploy to Production
    dependsOn: Deploy_QA
    condition: succeeded()
    jobs:
      - deployment: Deploy
        displayName: Swap QA slot → production
        pool:
          vmImage: windows-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureAppServiceSettings@1
                  displayName: Apply App Settings (prod)
                  inputs:
                    azureSubscription: $(azureSubscription)
                    appName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    slotName: $(qaSlot)
                    appSettings: |
                      [
                        { "name": "ASPNETCORE_ENVIRONMENT",                  "value": "Production",                                                             "slotSetting": true },
                        { "name": "ConnectionStrings__DefaultConnection",    "value": "$(ComplianceHub_DB_CONNECTION_PROD)",                                              "slotSetting": true },
                        { "name": "ConnectionStrings__RegulationsConnection","value": "$(ComplianceHub_REGULATIONS_DB_CONN_PROD)",                                        "slotSetting": true },
                        { "name": "ALLOWED_ORIGIN_CLIENT_URL",               "value": "https://app-compliance-hub-ui-g4gmfpfsaeg9fdca.canadacentral-01.azurewebsites.net",                                   "slotSetting": true },
                        { "name": "WEBSITE_RUN_FROM_PACKAGE",                "value": "1",                                                                      "slotSetting": false }
                      ]

                - task: AzureAppServiceManage@0
                  displayName: Swap QA slot → production
                  inputs:
                    azureSubscription: $(azureSubscription)
                    action: Swap Slots
                    webAppName: $(apiAppServiceName)
                    resourceGroupName: $(resourceGroup)
                    sourceSlot: $(qaSlot)
                    swapWithProduction: true
