name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # Gemini reviewer: runs on PR open/update, posts review findings (with the
  # <!-- ai-pr-review --> marker), enforces the iteration cap, and posts the
  # resolution / approval. Never runs the fix step.
  gemini-review:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.AIPR_GITHUB_TOKEN || github.token }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore runner
        run: dotnet restore Source/server/ComplianceHub.AiPrRunner/ComplianceHub.AiPrRunner.csproj

      - name: Run AI PR reviewer
        env:
          AiPrAutomation__Mode: Live
          AiPrAutomation__GitProvider: GitHub
          AiPrAutomation__AiProvider: Gemini
          AiPrAutomation__MaxReviewFixIterations: '6'
          AiPrAutomation__AllowMerge: 'false'
          AiPrAutomation__AllowApproval: 'true'
          AiPrAutomation__WorkspaceRoot: ${{ runner.temp }}/ai-pr-workspaces
          AIPR_GEMINI_API_KEY: ${{ secrets.AIPR_GEMINI_API_KEY }}
          AIPR_GITHUB_TOKEN: ${{ secrets.AIPR_GITHUB_TOKEN || github.token }}
          AIPR_VALIDATION_COMMANDS: dotnet restore Source/server/ComplianceHub.sln||dotnet build Source/server/ComplianceHub.sln --no-restore||dotnet test Source/server/ComplianceHub.sln --no-build
        run: dotnet run --project Source/server/ComplianceHub.AiPrRunner/ComplianceHub.AiPrRunner.csproj --no-restore

  # Claude Code fixer: triggered by Gemini's marked review comment. Uses the
  # Claude subscription (OAuth token, no API key) to agentically fix the PR,
  # build, commit and push back to the PR branch. The push (via the PAT)
  # re-triggers gemini-review, continuing the loop until resolved or capped.
  claude-fix:
    if: >-
      ${{ github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && contains(github.event.comment.body, '<!-- ai-pr-review -->')
      && !contains(github.event.comment.body, '<!-- ai-pr-resolved -->')
      && !contains(github.event.comment.body, '<!-- ai-pr-human-needed -->') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AIPR_GITHUB_TOKEN }}
          # persist-credentials keeps the PAT in the git remote so Claude's
          # push triggers the synchronize event (anti-recursion needs a PAT,
          # not the default GITHUB_TOKEN).
          persist-credentials: true

      - name: Check out PR branch
        env:
          GH_TOKEN: ${{ secrets.AIPR_GITHUB_TOKEN }}
        run: gh pr checkout ${{ github.event.issue.number }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Claude Code fixes review comments
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AIPR_GITHUB_TOKEN }}
          claude_args: '--allowedTools Read,Edit,Write,Bash'
          prompt: >-
            An automated reviewer left change requests on this pull request.
            Read the most recent PR comment that contains the marker
            "<!-- ai-pr-review -->" and treat its findings as the work to do.
            Implement the requested code fixes in this repository. Then run
            `dotnet build Source/server/ComplianceHub.sln` and fix any build
            errors you introduced. When the build succeeds, commit all changes
            with a clear message and push them to the current PR branch
            (the branch is already checked out; use the existing git remote).
            Do not merge the PR. Do not modify GitHub Actions workflow files,
            secrets, or files under bin/obj.
